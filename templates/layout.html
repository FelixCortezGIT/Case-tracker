<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">

            <a class="navbar-brand" href="/new-case">
                Case Tracker
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="/new_case">New Case</a>
                <a class="nav-link" href="/case_detail">Case Work</a>
                <a class="nav-link" href="/letter_ques">Letter Queues</a>
                <a class="nav-link" href="/chaser_ques">Chaser Queues</a>
            </div>

        </div>
    </nav>

    <div class="container-fluid mt-4 px-5">

        <div class="row gx-5">

            <div class="col-md-3">
                {% block content %}
                {% endblock %}
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5>Case Info</h5>
                    <p class="text-muted">Case information will appear here.</p>
                </div>
            </div>

            <div class="col-md-5">

                <div class="card p-3 mb-4">
                    <h5>Notes</h5>
                    <textarea class="form-control" rows="5"></textarea>
                </div>

                <div class="card p-3 h-50">
                    <h5>Log</h5>
                    <p class="text-muted">Log entries will appear here.</p>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
