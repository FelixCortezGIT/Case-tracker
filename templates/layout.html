<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">
            <a class="navbar-brand mb-0 h1">Case Tracker</a>

            <div class="navbar-nav">
                <a class="nav-link" href="/new_case">New Case</a>
                <a class="nav-link" href="/case_detail">Case Work</a>
                <a class="nav-link" href="/letter_ques">Letter Queues</a>
                <a class="nav-link" href="/chaser_ques">Chaser Queues</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 px-5">
        <div class="row gx-5">
            <div class="col-md-3 d-flex flex-column">
                {% block content %}
                {% endblock %}
            </div>

            <div class="col-md-4 d-flex flex-column gap-4">
                <div class="card p-3 case-info-card">
                    <h5>Case Info</h5>
                    <p class="text-muted">Case information will appear here.</p>
                </div>

                <div class="card p-3 action-card">
                    <div class="mb-3">
                        <label for="deadline" class="form-label">Deadline</label>
                        <input type="date" class="form-control" id="deadline" name="deadline" form="new-case-form" required>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" form="new-case-form">
                            <option value="letter">Letter Sent</option>
                            <option value="chaser">Chaser Sent</option>
                            <option value="chargeback">Chargeback</option>
                            <option value="representment">Representment</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>

                    <button type="submit" form="new-case-form" class="btn btn-secondary w-100">
                        Confirm
                    </button>
                </div>
            </div>

            <div class="col-md-5 d-flex flex-column gap-4">
                <div class="card p-3 notes-card">
                    <h5>Notes</h5>
                    <textarea class="form-control" rows="5"></textarea>
                </div>

                <div class="card p-3 log-card">
                    <h5>Log</h5>
                    <p class="text-muted">Log entries will appear here.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
